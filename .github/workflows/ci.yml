name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Harness self-tests
        run: python3 tools/harness/selftest.py

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        # The action's default list includes `tools`, which cmdline-tools 20 no longer carries,
        # and sdkmanager fails the step on it.
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        # The runner's bundled sdkmanager repository predates API 37 and can't resolve
        # platforms;android-37 or build-tools;37.0.0, so fetch both archives from Google's
        # SDK repo directly and unpack them where sdkmanager would.
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          install_sdk_pkg() {
            curl -fsSL "$1" -o "$RUNNER_TEMP/sdk-pkg.zip"
            rm -rf "$RUNNER_TEMP/sdk-pkg" && unzip -q "$RUNNER_TEMP/sdk-pkg.zip" -d "$RUNNER_TEMP/sdk-pkg"
            mkdir -p "$(dirname "$2")" && rm -rf "$2"
            mv "$(find "$RUNNER_TEMP/sdk-pkg" -mindepth 1 -maxdepth 1 -type d)" "$2"
          }
          install_sdk_pkg https://dl.google.com/android/repository/platform-37.0_r02.zip "$ANDROID_HOME/platforms/android-37"
          install_sdk_pkg https://dl.google.com/android/repository/build-tools_r37_linux.zip "$ANDROID_HOME/build-tools/37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Install test tools
        # ffmpeg: the desktop H.264 decoder is an ffmpeg process, and the flags it drives one with
        # were arrived at empirically (see FfmpegH264DecoderTest). binutils: LlamatikNativeIsaTest
        # disassembles the shipped natives to prove they do not run AVX-512 before any CPU dispatch
        # (see the llamatik pin in gradle/libs.versions.toml). Both tests skip themselves where the
        # tool is missing, so without this step a regression in either would go green here.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg binutils

      - name: Planned tests, builds and static analysis
        # Explicit leaf suites, builds/lint and detekt come from the shared planner. Compose tests
        # need Xvfb; CI=true adds -PskerryCi=1 for checks requiring installed ffmpeg/binutils.
        run: xvfb-run --auto-servernum python3 tools/harness/gate.py run --build-only

      # Gradle prints only the assertion's file and line; the values it compared live in the report.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          include-hidden-files: true
          path: |
            **/build/reports/tests/
            **/build/test-results/
            **/build/reports/detekt/
            .git/skerry-harness-v2/logs/
          retention-days: 7
